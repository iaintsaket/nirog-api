# Cloud Build config used by cloud-run.sh. BuildKit is needed for the Dockerfile's cache mounts.
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
# Default machine (e2-standard-2): the only one Cloud Build's free minutes cover.
